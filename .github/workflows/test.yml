name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fpdf2 pypdf pytest
      - run: pytest -q skills/ada-report/tests skills/seo-score/tests
